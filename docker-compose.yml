version: '3.8'

services:
  lb:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web-n01
      - web-n02

  web-n01:
    build: ./app
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis-store
    depends_on:
      - redis-store

  web-n02:
    build: ./app
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis-store
    depends_on:
      - redis-store

  redis-store:
    image: redis:alpine
    ports:
      - "6379:6379"
